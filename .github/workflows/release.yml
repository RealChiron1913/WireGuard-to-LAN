name: manual-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.1.0
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing tag and package version
        run: |
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          python - <<'PY'
          import os, re
          from pathlib import Path
          version=re.search(r'^PKG_VERSION:=(.+)$',Path('Makefile').read_text(),re.M)[1]
          assert os.environ['RELEASE_TAG']=='v'+version, 'Tag does not match package version'
          PY
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pytest tests -q
      - run: node --check htdocs/luci-static/resources/view/wgnat6.js
      - run: node --test tests/test_frontend.cjs
      - run: sh tools/check_shell.sh
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - run: |
          for profile in home office routed; do
            sudo "$(which python)" tests/linux_network.py --profile "$profile"
          done
      - run: python tools/build_ipk.py
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
